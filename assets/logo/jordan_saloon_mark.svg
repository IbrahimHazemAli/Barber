<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="chromeLightMark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e0e0e0"/>
      <stop offset="50%" stop-color="#8a8a8a"/>
      <stop offset="70%" stop-color="#2a2a2a"/>
      <stop offset="85%" stop-color="#999999"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    
    <linearGradient id="chromeBladeMark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#222222"/>
      <stop offset="35%" stop-color="#aaaaaa"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#bbbbbb"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>

    <filter id="markGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <filter id="markRim" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#markGlow)">
    <!-- J stem -->
    <path d="M 155,90 L 265,90 L 265,115 L 215,115 L 215,295 C 215,360 270,370 315,335 C 355,300 365,250 353,200 C 345,170 320,150 290,150 L 290,125 C 335,125 375,155 385,205 C 400,270 380,340 330,380 C 270,425 185,405 185,305 L 185,115 L 155,115 Z" 
          fill="url(#chromeLightMark)" stroke="#111" stroke-width="1.5"/>

    <!-- Sharp Razor Blade Slash -->
    <polygon points="115,340 380,145 385,152 120,347" 
             fill="url(#chromeBladeMark)" filter="url(#markRim)"/>
    
    <!-- Pivot Dot -->
    <circle cx="155" cy="280" r="15" fill="url(#chromeLightMark)" filter="url(#markRim)"/>
  </g>
</svg>
