<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Metallic Chrome Gradients -->
    <linearGradient id="chromeLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e0e0e0"/>
      <stop offset="50%" stop-color="#8a8a8a"/>
      <stop offset="70%" stop-color="#2a2a2a"/>
      <stop offset="85%" stop-color="#999999"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    
    <linearGradient id="chromeBlade" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#222222"/>
      <stop offset="35%" stop-color="#aaaaaa"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#bbbbbb"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>

    <linearGradient id="chromeText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#ededed"/>
      <stop offset="50%" stop-color="#7a7a7a"/>
      <stop offset="75%" stop-color="#cccccc"/>
      <stop offset="100%" stop-color="#444444"/>
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <filter id="rimLight" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Monogram Mark Group -->
  <g filter="url(#subtleGlow)" transform="translate(0, -10)">
    <!-- Main J Serif Top & Stem -->
    <path d="M 155,100 L 255,100 L 255,122 L 210,122 L 210,290 C 210,355 265,365 310,330 C 350,295 360,245 348,195 C 340,165 315,145 285,145 L 285,122 C 330,122 370,150 380,200 C 395,265 375,335 325,375 C 265,420 180,400 180,300 L 180,122 L 155,122 Z" 
          fill="url(#chromeLight)" stroke="#111111" stroke-width="1.5"/>

    <!-- Sharp Razor / Blade Diagonal Slash through J loop -->
    <polygon points="115,335 375,140 380,147 120,342" 
             fill="url(#chromeBlade)" filter="url(#rimLight)"/>
    
    <!-- Accent Dot / Pivot Point -->
    <circle cx="155" cy="275" r="14" fill="url(#chromeLight)" filter="url(#rimLight)"/>
  </g>

  <!-- Typography: JORDAN SALOON -->
  <g filter="url(#subtleGlow)">
    <text x="250" y="445" 
          font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" 
          font-size="28" 
          font-weight="900" 
          letter-spacing="5.5" 
          text-anchor="middle" 
          fill="url(#chromeText)">
      JORDAN SALOON
    </text>
  </g>
</svg>
